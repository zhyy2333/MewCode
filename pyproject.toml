[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "A minimal command-line AI coding assistant chat shell."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "httpx>=0.28.1,<1",
    "openai>=2.49.0",
    "prompt-toolkit>=3.0,<4",
    "PyYAML",
    "jsonschema>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
